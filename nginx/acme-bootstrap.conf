# FIX (new file): HTTP-only config used by the nginx-bootstrap service to get the
# very first Let's Encrypt certificate (see the README, "First-time setup").

server {
    listen 80;
    listen [::]:80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
