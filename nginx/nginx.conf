server {
    listen       7777;
    listen  [::]:7777;
    server_name  shortener.tinysun.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shortener.tinysun.net;

    ssl_certificate     /etc/letsencrypt/live/shortener.tinysun.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shortener.tinysun.net/privkey.pem;

    location / {
        proxy_pass http://app_server:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}