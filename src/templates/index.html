<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
:root {
    --bg: #fafafa;
    --panel: #ffffff;
    --border: #e7e7e5;
    --ink: #171717;
    --ink-soft: #8a8a86;
    --accent: #171717;
    --accent-hover: #000000;
}

* { box-sizing: border-box; }

html, body {
    height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(#171717 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    background-position: center center;
}

.card {
    width: 420px;
    max-width: 90vw;
    background: var(--panel);
    border: 3px solid #000000;
    border-radius: 0;
}

.titlebar {
    padding: 40px 40px 0;
    text-align: left;
}

.titlebar h3 {
    margin: 0;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.02em;
    color: var(--ink);
}

.titlebar .tagline {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-soft);
}

.body-area {
    padding: 24px 40px 40px;
}

label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
}

input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 0;
    background: #fdfdfd;
    transition: border-color 0.15s ease;
}

input[type="text"]:focus {
    outline: none;
    border-color: var(--ink);
}

.submit-row {
    margin-top: 16px;
}

input[type="submit"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    border: none;
    border-radius: 0;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
    background: var(--accent);
    cursor: pointer;
    transition: background 0.15s ease;
}

input[type="submit"]:hover {
    background: var(--accent-hover);
}

input[type="submit"]:active {
    opacity: 0.85;
}

.result {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
}

.result input[type="text"] {
    margin-bottom: 0;
    cursor: pointer;
    color: var(--ink);
    background: #f5f5f4;
}

.error {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    text-align: center;
}

.error label {
    color: #ff4242;
}

.footnote {
    padding: 0 40px 28px;
    text-align: left;
    font-size: 11px;
    color: #c4c4c0;
}

</style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <h3>Shorten a link</h3>
      <div class="tagline">Paste a web address below</div>
    </div>
    <div class="body-area">
      <form method="post">
        <label for="url">Web address</label>
        <input type="text" id="url" name="url" placeholder="example.com" required>
        <div class="submit-row">
          <input type="submit" value="Shorten">
        </div>
      </form>

    {% if short_url %}
    <div class="result">
        <label>Your short link</label>
        <input type="text" value="{{ short_url }}" readonly onclick="this.select()">
        </div>
    {% endif %}

    {% if error %}
    <div class="error">
        <label>{{ error }}</label>
        </div>
    {% endif %}
    </div>
    <div class="footnote">chromatic0</div>
  </div>
</body>
</html>
