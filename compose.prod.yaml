services:
  nginx:
    image: nginx:1.28-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  nginx-bootstrap:
    image: nginx:1.28-alpine
    profiles: ["bootstrap"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/acme-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro

volumes:
  certbot-etc:
  certbot-www:
